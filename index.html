<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#030712">
  <title>Telémetro Móvil 3D</title>

  <!-- Estilos CesiumJS -->
  <link rel="stylesheet" href="https://unpkg.com/cesium@1.120.0/Build/Cesium/Widgets/widgets.css">

  <!-- Estilos de la Aplicación -->
  <link rel="stylesheet" href="style.css">

  <script>
    window.CESIUM_BASE_URL = 'https://unpkg.com/cesium@1.120.0/Build/Cesium/';
  </script>
  <script src="https://unpkg.com/cesium@1.120.0/Build/Cesium/Cesium.js"></script>
</head>
<body>

  <!-- Contenedor del Visor 3D Fullscreen -->
  <div id="cesiumContainer"></div>

  <!-- Capa HUD Táctica -->
  <div id="hudOverlay">
    
    <!-- Barra Superior -->
    <header class="hud-header">
      <!-- Indicador GPS Táctico (Rojo / Amarillo / Verde) -->
      <div class="gps-badge yellow" id="gpsBadge" title="Estado de señal GPS">
        <div id="gpsDot" class="gps-dot yellow"></div>
        <span id="gpsText" class="gps-label">BUSCANDO...</span>
      </div>

      <!-- Cinta de Azimut en Milésimas y Zoom Óptico (visible en primera persona) -->
      <div class="compass-ribbon hidden" id="compassRibbon">
        <span class="compass-value" id="compassHeadingMils">0000 ₥</span>
        <span class="compass-zoom" id="opticsZoomLevel" title="Aumento óptico">1.0x</span>
      </div>

      <!-- Grupo de Botones de la Cabecera -->
      <div class="header-actions">
        <!-- Botón de Postura (De pie 1.6m / Arrodillado 0.9m / Tendido 0.3m) -->
        <button id="postureBtn" class="hud-icon-btn hidden" title="Cambiar Postura: De pie (1.6m)">
          <span id="postureIcon" class="posture-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 21h16" stroke-width="1.5" opacity="0.3"/>
              <circle cx="12" cy="4" r="2" fill="currentColor"/>
              <path d="M12 6.5v7"/>
              <path d="M8 10h8"/>
              <path d="M9 21l3-7.5 3 7.5"/>
            </svg>
          </span>
        </button>

        <!-- Botón de Brújula (activada / desactivada) -->
        <button id="modeToggleBtn" class="hud-icon-btn hidden" title="Activar/Desactivar Brújula">
          <svg id="compassIconSvg" class="compass-svg" viewBox="0 0 24 24" width="22" height="22">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
            <polygon points="12,3 15,12 12,9 9,12" class="needle-north"/>
            <polygon points="12,21 15,12 12,15 9,12" class="needle-south"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Control Táctico de Altura Personalizada (Primera Persona) -->
    <div class="height-stepper-widget hidden" id="heightControlWidget">
      <button id="btnHeightUp" class="height-step-btn" title="Subir altura (+0.2m)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
      </button>
      <div class="height-step-display" id="heightDisplay" title="Altura del observador sobre el suelo">
        <span class="height-num" id="heightDisplayVal">1.6</span><span class="height-unit">m</span>
      </div>
      <button id="btnHeightDown" class="height-step-btn" title="Bajar altura (-0.2m)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
    </div>

    <!-- Toast de Notificación Rápida -->
    <div id="statusToast">Buscando satélites GPS...</div>

    <!-- PIN CENTRAL PARA AJUSTE DE UBICACIÓN (Fino y discreto) -->
    <div id="centerLocationPin" class="center-location-pin">
      <div class="pin-head"></div>
      <div class="pin-point"></div>
      <div class="pin-ring-pulse"></div>
    </div>

    <!-- BOTÓN DE CONFIRMACIÓN SIMPLE (Fase Aérea) -->
    <button id="btnConfirmLocation" class="btn-confirm-simple">
      CONFIRMAR
    </button>

    <!-- Retícula Central (Fase Primera Persona) -->
    <div class="reticle-container hidden" id="reticleContainer">
      <div class="reticle-ring"></div>
      <div class="reticle-inner-dot"></div>
      <div class="reticle-line horizontal-left"></div>
      <div class="reticle-line horizontal-right"></div>
      <div class="reticle-line vertical-top"></div>
      <div class="reticle-line vertical-bottom"></div>
    </div>

    <!-- Panel de Telemetría Inferior (Mantenido oculto por el momento según instrucción) -->
    <div class="telemetry-card hidden" id="telemetryCard">
      <div class="telemetry-grid">
        <div class="telemetry-item">
          <span class="label">DISTANCIA</span>
          <span class="val-highlight" id="resDirectDist">---</span>
        </div>
        <div class="telemetry-item">
          <span class="label">DESNIVEL</span>
          <span class="val" id="resDeltaH">---</span>
        </div>
        <div class="telemetry-item">
          <span class="label">AZIMUT</span>
          <span class="val" id="resBearing">---</span>
        </div>
        <div class="telemetry-item utm-item">
          <span class="label">UTM OBJETIVO</span>
          <span class="val-mono" id="resUtm">---</span>
        </div>
      </div>
    </div>

    <!-- Barra de Acciones Inferior (Fase Primera Persona) -->
    <footer class="hud-bottom-actions hidden" id="bottomActions">
      <button id="btnMeasure" class="btn-tactical primary" title="Medir al centro de la retícula">
        🎯 MEDIR
      </button>
      <button id="btnClear" class="btn-tactical secondary" title="Limpiar objetivo">
        ✕
      </button>
    </footer>

  </div>

  <!-- Scripts -->
  <script src="telemetryLogger.js"></script>
  <script src="geoMath.js"></script>
  <script src="sensorManager.js"></script>
  <script src="cesium3DMap.js"></script>
  <script src="app.js"></script>
</body>
</html>

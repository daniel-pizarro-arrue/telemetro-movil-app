<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#030712">
  <title>Telémetro Móvil 3D - Fotogrametría Fotorrealista</title>

  <!-- Estilos CesiumJS -->
  <link rel="stylesheet" href="https://unpkg.com/cesium@1.120.0/Build/Cesium/Widgets/widgets.css">

  <!-- Estilos de la Aplicación -->
  <link rel="stylesheet" href="style.css">

  <script>
    // Configuración base de Cesium para recursos estáticos CDN
    window.CESIUM_BASE_URL = 'https://unpkg.com/cesium@1.120.0/Build/Cesium/';
  </script>
  <!-- CesiumJS UMD Bundle -->
  <script src="https://unpkg.com/cesium@1.120.0/Build/Cesium/Cesium.js"></script>
</head>
<body>

  <!-- Contenedor del Visor 3D Fullscreen -->
  <div id="cesiumContainer"></div>

  <!-- Capa HUD Táctica -->
  <div id="hudOverlay">
    
    <!-- Barra Superior -->
    <header class="hud-header">
      <div class="title-badge">
        <div class="radar-dot"></div>
        <span class="title-text">TELÉMETRO 3D // HUD</span>
      </div>

      <div class="header-status-group">
        <span id="gpsStatusChip" class="status-chip">GPS: BUSCANDO...</span>
        <button id="modeToggleBtn" class="status-chip active" title="Alternar entre modo sensores y navegación libre">
          MODO: BRÚJULA
        </button>
      </div>
    </header>

    <!-- Cinta de Brújula Superior -->
    <div class="compass-ribbon">
      <span class="compass-cardinal" id="compassCardinal">N</span>
      <span class="compass-value" id="compassHeading">000°</span>
      <span class="compass-cardinal" id="compassPitch">0.0°</span>
    </div>

    <!-- Mensaje Toast de Estado -->
    <div id="statusToast">Cargando mapa 3D fotorrealista...</div>

    <!-- Retícula Central Táctica -->
    <div class="reticle-container">
      <div class="reticle-ring"></div>
      <div class="reticle-inner-dot"></div>
      <div class="reticle-line horizontal-left"></div>
      <div class="reticle-line horizontal-right"></div>
      <div class="reticle-line vertical-top"></div>
      <div class="reticle-line vertical-bottom"></div>
      <div id="reticlePitchBadge" class="reticle-pitch-badge">0°</div>
    </div>

    <!-- Calibrador de Brújula (Alineación fina con cerros reales) -->
    <div class="calibration-bar" id="calibrationBar">
      <label for="headingOffsetRange">Calibrar Azimut:</label>
      <input type="range" id="headingOffsetRange" min="-45" max="45" value="0" step="1">
      <span class="calibration-val" id="headingOffsetVal">0°</span>
    </div>

    <!-- Tarjeta de Resultados de Telemetría -->
    <div class="telemetry-card" id="telemetryCard">
      <div class="telemetry-primary-grid">
        <div class="telemetry-hero">
          <span class="label">Distancia 3D</span>
          <span class="val-big" id="resDirectDist">---</span>
        </div>
        <div class="telemetry-stat">
          <span class="label">Dist. Horiz.</span>
          <span class="val" id="resHorizDist">---</span>
        </div>
        <div class="telemetry-stat">
          <span class="label">Desnivel ΔH</span>
          <span class="val" id="resDeltaH">---</span>
        </div>
      </div>

      <div class="telemetry-secondary-row">
        <span>Rumbo: <strong id="resBearing">---</strong></span>
        <span>Ángulo: <strong id="resAngle">---</strong></span>
      </div>

      <div class="telemetry-secondary-row">
        <span>Destino: <strong id="resCoords">Toca un punto o dispara al centro</strong></span>
      </div>

      <div class="telemetry-firebase-status">
        <span id="firebaseIndicator">●</span>
        <span id="firebaseText">Telemetría conectada a Firebase RTDB</span>
      </div>
    </div>

    <!-- Barra de Acciones Inferior -->
    <footer class="hud-bottom-actions">
      <button id="btnSensors" class="btn-tactical" title="Activar giroscopio y brújula">
        🧭 SENSORES
      </button>

      <button id="btnMeasure" class="btn-tactical primary" title="Medir distancia al objetivo en la retícula central">
        🎯 MEDIR
      </button>

      <button id="btnFreeze" class="btn-tactical" title="Fijar orientación para apuntar">
        ❄️ FIJAR
      </button>

      <button id="btnClear" class="btn-tactical" title="Limpiar objetivo">
        ✕
      </button>
    </footer>

  </div>

  <!-- Scripts de la Aplicación -->
  <script src="telemetryLogger.js"></script>
  <script src="geoMath.js"></script>
  <script src="sensorManager.js"></script>
  <script src="cesium3DMap.js"></script>
  <script src="app.js"></script>
</body>
</html>

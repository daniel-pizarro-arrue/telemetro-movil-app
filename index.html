<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#030712">
  <title>Telémetro Móvil 3D</title>

  <!-- Estilos CesiumJS -->
  <link rel="stylesheet" href="https://unpkg.com/cesium@1.120.0/Build/Cesium/Widgets/widgets.css">

  <!-- Estilos de la Aplicación -->
  <link rel="stylesheet" href="style.css">

  <script>
    window.CESIUM_BASE_URL = 'https://unpkg.com/cesium@1.120.0/Build/Cesium/';
  </script>
  <script src="https://unpkg.com/cesium@1.120.0/Build/Cesium/Cesium.js"></script>
</head>
<body>

  <!-- Contenedor del Visor 3D Fullscreen -->
  <div id="cesiumContainer"></div>

  <!-- Capa HUD Táctica Limpia -->
  <div id="hudOverlay">
    
    <!-- Barra Superior Minimalista -->
    <header class="hud-header">
      <!-- Indicador pequeño de estado GPS (Rojo / Amarillo / Verde) -->
      <div class="gps-indicator-wrap" title="Estado de señal GPS">
        <div id="gpsDot" class="gps-dot yellow"></div>
      </div>

      <!-- Cinta de Azimut en Milésimas (6400) -->
      <div class="compass-ribbon">
        <span class="compass-cardinal" id="compassCardinal">N</span>
        <span class="compass-value" id="compassHeadingMils">0000 ₥</span>
      </div>

      <!-- Botón de Modo con Icono de Brújula Activa / Inactiva -->
      <button id="modeToggleBtn" class="mode-icon-btn active" title="Alternar Modo Brújula / Navegación Libre">
        <svg id="compassIconSvg" class="compass-svg" viewBox="0 0 24 24" width="24" height="24">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
          <polygon points="12,3 15,12 12,9 9,12" class="needle-north"/>
          <polygon points="12,21 15,12 12,15 9,12" class="needle-south"/>
        </svg>
      </button>
    </header>

    <!-- Toast de Notificación Rápida -->
    <div id="statusToast">Iniciando mapa 3D...</div>

    <!-- Retícula Central Limpia (Sin indicadores numéricos) -->
    <div class="reticle-container">
      <div class="reticle-ring"></div>
      <div class="reticle-inner-dot"></div>
      <div class="reticle-line horizontal-left"></div>
      <div class="reticle-line horizontal-right"></div>
      <div class="reticle-line vertical-top"></div>
      <div class="reticle-line vertical-bottom"></div>
    </div>

    <!-- Panel de Telemetría Inferior (Ubicado abajo para despejar la vista) -->
    <div class="telemetry-card" id="telemetryCard">
      <div class="telemetry-grid">
        <div class="telemetry-item">
          <span class="label">DISTANCIA</span>
          <span class="val-highlight" id="resDirectDist">---</span>
        </div>
        <div class="telemetry-item">
          <span class="label">DESNIVEL</span>
          <span class="val" id="resDeltaH">---</span>
        </div>
        <div class="telemetry-item">
          <span class="label">AZIMUT</span>
          <span class="val" id="resBearing">---</span>
        </div>
        <div class="telemetry-item utm-item">
          <span class="label">UTM OBJETIVO</span>
          <span class="val-mono" id="resUtm">Toca o mide al centro</span>
        </div>
      </div>
    </div>

    <!-- Barra de Acciones Inferior Simplificada -->
    <footer class="hud-bottom-actions">
      <button id="btnMeasure" class="btn-tactical primary" title="Medir al centro de la retícula">
        🎯 MEDIR
      </button>
      <button id="btnClear" class="btn-tactical secondary" title="Limpiar objetivo medido">
        ✕
      </button>
    </footer>

  </div>

  <!-- Scripts -->
  <script src="telemetryLogger.js"></script>
  <script src="geoMath.js"></script>
  <script src="sensorManager.js"></script>
  <script src="cesium3DMap.js"></script>
  <script src="app.js"></script>
</body>
</html>
